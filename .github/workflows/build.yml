name: Build
run-name: ${{ github.ref_type == 'tag' && format('Release {0}', github.ref_name) || (inputs.build_type == 'release' && format('Release {0}', inputs.tag_name) || 'Dev source build') }}

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      build_type:
        description: Build type
        type: choice
        default: dev
        options: [dev, release]
      tag_name:
        description: Release tag to create (vX.Y.Z); leave empty for dev
        type: string
        required: false
  workflow_call:
    inputs:
      build_type:
        type: string
        default: dev
      tag_name:
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: smo2pc-build-${{ github.event_name }}-${{ github.ref }}-${{ inputs.tag_name }}
  cancel-in-progress: ${{ github.ref_type != 'tag' && inputs.build_type != 'release' }}

jobs:
  prepare:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      ref: ${{ steps.version.outputs.ref }}
      channel: ${{ steps.version.outputs.channel }}
      artifact: ${{ steps.version.outputs.artifact }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Resolve version and source commit
        id: version
        shell: pwsh
        env:
          BUILD_TYPE: ${{ inputs.build_type || (github.ref_type == 'tag' && 'release') || 'dev' }}
          TAG_NAME: ${{ inputs.tag_name }}
        run: python tools/resolve-build-version.py

  verify:
    needs: prepare
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.prepare.outputs.ref }}

  package:
    name: Windows builder
    needs: [prepare, verify]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: builder/ui/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build React builder interface
        working-directory: builder/ui
        run: |
          npm ci
          npm run build
      - name: Prepare private embedded build payload
        shell: pwsh
        env:
          BUILD_VERSION: ${{ needs.prepare.outputs.version }}
          BUILDER_SOURCE_ARCHIVE: ${{ runner.temp }}\smo2pc-builder-source.zip
        run: git archive --format=zip --prefix="smo2pc-$env:BUILD_VERSION/" --output="$env:BUILDER_SOURCE_ARCHIVE" HEAD
      - name: Publish standalone Windows builder
        env:
          BUILD_VERSION: ${{ needs.prepare.outputs.version }}
          BUILDER_SOURCE_ARCHIVE: ${{ runner.temp }}\smo2pc-builder-source.zip
        run: dotnet publish builder/app/Smo2pc.Builder.csproj --configuration Release --runtime win-x64 --self-contained true --nologo -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugSymbols=false -p:DebugType=None -p:Version=$env:BUILD_VERSION -p:BuilderSourceArchive=$env:BUILDER_SOURCE_ARCHIVE --output artifacts/builder-app
      - name: Package app and checksum
        env:
          BUILD_VERSION: ${{ needs.prepare.outputs.version }}
        run: python tools/package-builder.py --version $env:BUILD_VERSION --publish artifacts/builder-app
      - name: Upload versioned build packages
        uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.prepare.outputs.artifact }}
          path: |
            artifacts/distribution/*.zip
            artifacts/distribution/*.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release
    if: needs.prepare.outputs.channel == 'release'
    needs: [prepare, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.prepare.outputs.artifact }}
          path: release-assets
      - name: Create release tag at the built commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          SOURCE_COMMIT: ${{ needs.prepare.outputs.ref }}
        run: |
          set -euo pipefail
          resolve_tag_commit() {
            local tag_data tag_type tag_sha
            tag_data="$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" \
              --jq '[.object.type, .object.sha] | @tsv')"
            IFS=$'\t' read -r tag_type tag_sha <<< "$tag_data"
            while [ "$tag_type" = "tag" ]; do
              tag_data="$(gh api "repos/$GH_REPO/git/tags/$tag_sha" \
                --jq '[.object.type, .object.sha] | @tsv')"
              IFS=$'\t' read -r tag_type tag_sha <<< "$tag_data"
            done
            if [ "$tag_type" != "commit" ]; then
              echo "Release tag $RELEASE_TAG resolves to unexpected object type '$tag_type'." >&2
              return 1
            fi
            printf '%s' "$tag_sha"
          }

          tag_object="$(gh api --method POST "repos/$GH_REPO/git/tags" \
            -f "tag=$RELEASE_TAG" \
            -f "message=Release $RELEASE_VERSION" \
            -f "object=$SOURCE_COMMIT" \
            -f "type=commit" --jq .sha)"
          if gh api --method POST "repos/$GH_REPO/git/refs" \
            -f "ref=refs/tags/$RELEASE_TAG" \
            -f "sha=$tag_object" >/dev/null; then
            echo "Created release tag $RELEASE_TAG in $GH_REPO at $SOURCE_COMMIT."
          else
            tag_commit="$(resolve_tag_commit)"
            if [ "$tag_commit" != "$SOURCE_COMMIT" ]; then
              echo "Refusing to move release tag $RELEASE_TAG in $GH_REPO: tag target is $tag_commit; built commit is $SOURCE_COMMIT." >&2
              exit 1
            fi
            echo "Release tag $RELEASE_TAG in $GH_REPO already points to built commit $SOURCE_COMMIT."
          fi
      - name: Publish Windows builder download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          SOURCE_COMMIT: ${{ needs.prepare.outputs.ref }}
        run: |
          set -euo pipefail
          tag_data="$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" \
            --jq '[.object.type, .object.sha] | @tsv')"
          IFS=$'\t' read -r tag_type tag_sha <<< "$tag_data"
          while [ "$tag_type" = "tag" ]; do
            tag_data="$(gh api "repos/$GH_REPO/git/tags/$tag_sha" \
              --jq '[.object.type, .object.sha] | @tsv')"
            IFS=$'\t' read -r tag_type tag_sha <<< "$tag_data"
          done
          if [ "$tag_type" != "commit" ] || [ "$tag_sha" != "$SOURCE_COMMIT" ]; then
            echo "Release tag $RELEASE_TAG in $GH_REPO resolves to $tag_type $tag_sha; built commit is $SOURCE_COMMIT." >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --target "$SOURCE_COMMIT" --title "SMO2PC $RELEASE_VERSION" --generate-notes
          fi
