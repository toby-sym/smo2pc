name: Verify

on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true

permissions:
  contents: read

jobs:
  verify:
    name: Check source tools
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Check Python syntax
        run: python -m compileall -q scripts tools tests
      - name: Build the LibHac NCA importer
        run: |
          python scripts/install_libhac.py
          dotnet build tools/extract/libhac/LibHacExtractor.csproj --configuration Release --nologo
      - name: Check build step metadata
        run: python scripts/setup.py --steps
